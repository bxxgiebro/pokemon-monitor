name: Pokemon Stock Monitor

on:
  workflow_dispatch:
    inputs:
      start_alza_session:
        description: "Start / restart one 12-hour Alza monitoring session?"
        required: true
        type: boolean
        default: true
  schedule:
    # About every 10 min, offset from minute 0 to reduce GitHub delays.
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_IHRYSKO: ${{ secrets.DISCORD_WEBHOOK_IHRYSKO }}
          DISCORD_WEBHOOK_VESELYDRAK: ${{ secrets.DISCORD_WEBHOOK_VESELYDRAK }}
          DISCORD_WEBHOOK_SMARTY: ${{ secrets.DISCORD_WEBHOOK_SMARTY }}
          DISCORD_WEBHOOK_PGS: ${{ secrets.DISCORD_WEBHOOK_PGS }}
          DISCORD_WEBHOOK_BRLOH: ${{ secrets.DISCORD_WEBHOOK_BRLOH }}
          DISCORD_WEBHOOK_DRACIK: ${{ secrets.DISCORD_WEBHOOK_DRACIK }}
          DISCORD_WEBHOOK_ALZA: ${{ secrets.DISCORD_WEBHOOK_ALZA }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ALZA_ENABLED: 'true'
          ALZA_TARGET_URL: ${{ vars.ALZA_TARGET_URL }}
          ALZA_CHECK_INTERVAL_SECONDS: '600'
          ALZA_START_SESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.start_alza_session }}
        run: |
          echo "ALZA_ENABLED=${ALZA_ENABLED}"
          python pokemon_monitor.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@github.com"
          git add seen_state.json
          if ! git diff --quiet --cached; then
            git commit -m "Update stock state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
